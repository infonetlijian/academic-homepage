<div class="card google-scholar-card">
  <h3><i class="fas fa-graduation-cap"></i> Google Scholar 引用（实时）</h3>

  <div id="gs-summary">
    <p id="gs-loading">正在加载 Google Scholar 数据…（通过开放代理获取）</p>
  </div>

  <div style="width:100%;max-width:720px;">
    <canvas id="gs-citations-chart" style="width:100%;height:260px;display:none"></canvas>
  </div>

  <p class="small"><a id="gs-link" href="#" target="_blank" rel="noopener">打开 Google Scholar 个人主页</a></p>
</div>

<script>
(function(){
  const USER_ID = 'ZuP2MtEAAAAJ';
  // 使用开放代理 r.jina.ai 直接抓取 scholar 页面（在中国大陆通常可访问）
  const PROXY_URL = 'https://r.jina.ai/http://scholar.google.com/citations?user=' + encodeURIComponent(USER_ID) + '&hl=zh-CN';

  const loadingEl = document.getElementById('gs-loading');
  const summaryEl = document.getElementById('gs-summary');
  const linkEl = document.getElementById('gs-link');
  const canvas = document.getElementById('gs-citations-chart');

  linkEl.href = 'https://scholar.google.com/citations?user=' + encodeURIComponent(USER_ID);

  function showError(msg){
    loadingEl.textContent = msg;
  }

  function loadChartJs(){
    return new Promise((resolve, reject) => {
      if (window.Chart) return resolve(window.Chart);
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload = () => resolve(window.Chart);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function parseProfileHtml(html) {
    // 解析 scholar 页面 HTML，提取总引用、h-index、i10 及按年引用
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const result = { total: null, hindex: null, i10: null, byYear: {} };

    // 表格 #gsc_rsb_st 包含 Citations / h-index / i10-index
    const table = doc.querySelector('#gsc_rsb_st');
    if (table) {
      const rows = table.querySelectorAll('tbody tr');
      rows.forEach(tr => {
        const th = tr.querySelector('td.gsc_rsb_t') || tr.querySelector('th');
        const t = th ? th.textContent.trim().toLowerCase() : '';
        const vals = Array.from(tr.querySelectorAll('td.gsc_rsb_std')).map(td => td.textContent.trim());
        if (t.includes('citations')) {
          result.total = vals[0] ? Number(vals[0].replace(/,/g,'')) : null; // all
        } else if (t.includes('h-index') || t.includes('h index')) {
          result.hindex = vals[0] ? Number(vals[0].replace(/,/g,'')) : null;
        } else if (t.includes('i10-index') || t.includes('i10 index')) {
          result.i10 = vals[0] ? Number(vals[0].replace(/,/g,'')) : null;
        }
      });
    }

    // 年度引用：类名 gsc_g_t（年份）与 gsc_g_al（对应数值）成对出现
    const years = Array.from(doc.querySelectorAll('.gsc_g_t')).map(el => el.textContent.trim());
    const vals = Array.from(doc.querySelectorAll('.gsc_g_al')).map(el => el.textContent.trim());
    if (years.length && vals.length && years.length === vals.length) {
      years.forEach((y, i) => {
        const n = Number(vals[i].replace(/,/g,'')) || 0;
        result.byYear[y] = n;
      });
    }

    return result;
  }

  async function render(){
    try {
      const res = await fetch(PROXY_URL, { cache: 'no-cache', mode: 'cors' });
      if (!res.ok) throw new Error('抓取失败: ' + res.status);
      const html = await res.text();

      const data = parseProfileHtml(html);

      loadingEl.remove();

      const summaryDiv = document.createElement('div');
      summaryDiv.innerHTML = `
        <p>总引用数：<strong>${data.total ?? '—'}</strong></p>
        <p>h-index：<strong>${data.hindex ?? '—'}</strong>　i10-index：<strong>${data.i10 ?? '—'}</strong></p>
      `;
      summaryEl.appendChild(summaryDiv);

      const years = Object.keys(data.byYear).sort((a,b)=>Number(a)-Number(b));
      if (years.length) {
        const values = years.map(y => data.byYear[y]);

        await loadChartJs();
        canvas.style.display = 'block';
        const ctx = canvas.getContext('2d');
        // eslint-disable-next-line no-undef
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: years,
            datasets: [{
              label: '年度引用数',
              data: values,
              backgroundColor: '#3b82f6',
              borderRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { title: { display: true, text: '年份' } },
              y: { title: { display: true, text: '引用数' }, beginAtZero: true }
            },
            plugins: { legend: { display: false } }
          }
        });
      } else {
        const note = document.createElement('p');
        note.className = 'small muted';
        note.textContent = '无法获得年度引用分布（页面未包含时间序列或代理响应格式不同）。';
        summaryEl.appendChild(note);
      }
    } catch (err) {
      console.error(err);
      showError('无法获取 Google Scholar 数据（代理不可用或页面结构变化）。');
    }
  }

  render();
})();
</script>

<style>
.google-scholar-card .small { font-size: 0.85rem; color:#6b7280; }
.google-scholar-card .muted { color:#6b7280; }
</style>
