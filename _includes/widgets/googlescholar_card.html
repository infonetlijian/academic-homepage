<div class="card google-scholar-card">
  <h3><i class="fas fa-graduation-cap"></i> Google Scholar 引用</h3>

  <div id="gs-summary">
    <p id="gs-loading">正在加载 Google Scholar 数据…</p>
  </div>

  <div style="width:100%;max-width:720px;">
    <canvas id="gs-citations-chart" style="width:100%;height:260px;display:none"></canvas>
  </div>

  <p class="small"><a id="gs-link" href="#" target="_blank" rel="noopener">打开 Google Scholar 个人主页</a></p>
</div>

<script>
(function(){
  const USER_ID = 'ZuP2MtEAAAAJ'; // GoogleScholar user id (不包含 &hl)
  const ENDPOINT = '/api/scholar?user=' + encodeURIComponent(USER_ID); // 后端必须实现此接口

  const loadingEl = document.getElementById('gs-loading');
  const summaryEl = document.getElementById('gs-summary');
  const linkEl = document.getElementById('gs-link');
  const canvas = document.getElementById('gs-citations-chart');

  linkEl.href = 'https://scholar.google.com/citations?user=' + encodeURIComponent(USER_ID);

  function showError(msg){
    loadingEl.textContent = msg;
  }

  // 动态加载 Chart.js（如果需要绘图）
  function loadChartJs(){
    return new Promise((resolve, reject) => {
      if (window.Chart) return resolve(window.Chart);
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload = () => resolve(window.Chart);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function normalizeData(resp){
    // 期望后端返回：
    // { total_citations: number, citations_by_year: { "2018":5, "2019":10, ... }, hindex:number, i10:number }
    const total = resp.total_citations ?? resp.total ?? resp.totalCitations ?? null;
    const hindex = resp.hindex ?? resp.h_index ?? resp.h ?? null;
    const i10 = resp.i10 ?? resp.i10_index ?? resp.i10index ?? null;

    let series = null;
    if (resp.citations_by_year && typeof resp.citations_by_year === 'object') {
      series = resp.citations_by_year;
    } else if (resp.citations && Array.isArray(resp.citations)) {
      // 尝试识别 [{ year: '2019', citations: 5 }, ...]
      const map = {};
      resp.citations.forEach(it => {
        if (it.year != null) map[String(it.year)] = Number(it.citations ?? it.count ?? 0);
      });
      if (Object.keys(map).length) series = map;
    } else if (resp.raw && resp.raw.timeline) {
      // 后端可能返回原始结构；尝试提取 timeline
      const map = {};
      (resp.raw.timeline || []).forEach(it => {
        if (it.year) map[String(it.year)] = Number(it.citations ?? it.value ?? 0);
      });
      if (Object.keys(map).length) series = map;
    }

    return { total, hindex, i10, series };
  }

  async function render(){
    try {
      const res = await fetch(ENDPOINT, {cache: 'no-cache'});
      if (!res.ok) throw new Error('网络请求失败: ' + res.status);
      const j = await res.json();

      const { total, hindex, i10, series } = normalizeData(j);

      loadingEl.remove();

      const html = document.createElement('div');
      html.innerHTML = `
        <p>总引用数：<strong>${total ?? '—'}</strong></p>
        <p>h-index：<strong>${hindex ?? '—'}</strong>　i10-index：<strong>${i10 ?? '—'}</strong></p>
      `;
      summaryEl.appendChild(html);

      if (series && Object.keys(series).length){
        // 准备数据：按年份排序
        const years = Object.keys(series).map(y => Number(y)).sort((a,b)=>a-b).map(String);
        const values = years.map(y => Number(series[y] ?? 0));

        await loadChartJs();
        canvas.style.display = 'block';

        // eslint-disable-next-line no-undef
        const ctx = canvas.getContext('2d');
        // eslint-disable-next-line no-undef
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: years,
            datasets: [{
              label: '年度引用数',
              data: values,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,0.08)',
              fill: true,
              tension: 0.2,
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { title: { display: true, text: '年份' } },
              y: { title: { display: true, text: '引用数' }, beginAtZero: true }
            },
            plugins: {
              legend: { display: false },
              tooltip: { mode: 'index', intersect: false }
            }
          }
        });
      } else {
        const note = document.createElement('p');
        note.className = 'small muted';
        note.textContent = '无法获得年度引用分布（后端未返回时间序列）。';
        summaryEl.appendChild(note);
      }

    } catch (err) {
      console.error(err);
      showError('无法获取 Google Scholar 数据。请确认你已部署后端 /api/scholar，并返回预期的 JSON。');
    }
  }

  // 启动
  render();
})();
</script>

<style>
/* 可根据站点样式调整 */
.google-scholar-card .small { font-size: 0.85rem; color:#6b7280; }
.google-scholar-card .muted { color:#6b7280;
